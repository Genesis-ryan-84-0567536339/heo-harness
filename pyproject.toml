[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "heo-harness"
version = "3.0.0-alpha.1"
description = "The Modular AI Agent Runtime Framework inspired by DeepSeek Harness (Everything is a Plugin). Built by Anh Co La."
readme = "README.md"
authors = [
    { name = "Anh Cơ La (Ryan)", email = "genesis.corp.os@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "python-docx>=0.8.11",
    "openpyxl>=3.0.10",
]

[project.scripts]
heo-harness = "heo_harness.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["heo_harness*"]
